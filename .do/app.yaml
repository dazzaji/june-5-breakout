name: timeandtokens-blog
region: nyc
static_sites:
  - name: june-5-breakout
    git:
      repo_clone_url: https://github.com/dazzaji/june-5-breakout.git
      branch: main
    environment_slug: jekyll
    build_command: bundle exec jekyll build -d _site
    output_dir: _site
    index_document: index.html
    error_document: 404.html
    routes:
      - path: /
domains:
  - domain: blog.timeandtokens.ai
    type: PRIMARY
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
